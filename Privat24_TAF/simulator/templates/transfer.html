<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Privat24 — Transfer</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Privat24</h1>
    <h2>Переказ коштів</h2>

    <p>Доступний баланс: {{ "%.2f"|format(balance) }} UAH</p>

    <form method="POST" action="/transfer">

        <label>Одержувач</label>
        <input
            type="text"
            id="recipient"
            name="recipient"
        >

        <label>Сума (UAH)</label>
        <input
            type="number"
            id="amount"
            name="amount"
            step="0.01"
        >

        <label>Призначення платежу</label>
        <input
            type="text"
            id="description"
            name="description"
        >

        <button type="submit" id="submit-transfer">
            Підтвердити переказ
        </button>

    </form>

    {% if success %}
        <p id="transfer-success" class="success">
            {{ success }}
        </p>
    {% endif %}

    {% if error %}
        <p id="transfer-error" class="error">
            {{ error }}
        </p>
    {% endif %}

    <a href="/dashboard">Назад до кабінету</a>
</div>

</body>
</html>
